# The journey gate: one person, from a linked account to a drill.
#
# Every epic proved its own piece. This proves they are connected — which they
# were not: the ledger had no registered handlers, the canonical sync had no
# caller, nothing materialized a synced replay, nothing planned an analysis,
# nothing opened a coaching cycle, nothing wrote a progress reading and nothing
# created a practice assignment.
#
# It runs a real HTTP provider on loopback and a real Postgres. No external
# service is contacted and no secret is read.

name: Journey

on:
  pull_request:
  push:
    branches: [feat/journey-wiring]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install
        run: |
          npm ci
          cd server && npm ci
      - name: Unit gates for everything this touches
        working-directory: server
        run: |
          npm run sync:unit
          npm run onboarding:unit
          npm run goals:unit
          npm run practice:unit
          npm run ops:unit
          npm run v1:unit
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: The OpenAPI document matches the mounted routes
        working-directory: server
        run: npm run v1:openapi:check

  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FORMA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install
        run: |
          npm ci
          cd server && npm ci
      - name: The journey, end to end
        working-directory: server
        run: npm run journey:gate
      - name: The gates whose modules this changed
        working-directory: server
        run: |
          npm run v1:integration
          npm run v1:security
          npm run engine:integration
          npm run estimates:integration
