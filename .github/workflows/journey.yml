# The journey gate: one person, from a linked account to a drill.
#
# Every epic proved its own piece. This proves they are connected — which they
# were not: the ledger had no registered handlers, the canonical sync had no
# caller, nothing materialized a synced replay, nothing planned an analysis,
# nothing opened a coaching cycle, nothing wrote a progress reading and nothing
# created a practice assignment.
#
# It stays its own workflow because its failure means something the server
# gates cannot tell you. Those answer "is this piece broken"; this answers "are
# the pieces wired to each other", and a red check named Journey says which
# question you are looking at without opening it.
#
# Its former `offline` job is gone: it ran the unit gates and the OpenAPI check
# that `Server / Offline gates` now runs once for the whole repository, and its
# trailing "the gates whose modules this changed" step re-ran the v1, engine and
# estimate gates that `Server / Database gates` now runs once.
#
# It runs a real HTTP provider on loopback and a real Postgres. No external
# service is contacted and no secret is read.

name: Journey

on:
  pull_request:
    paths:
      - "server/**"
      - ".node-version"
      - ".github/workflows/journey.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".node-version"
      - ".github/workflows/journey.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journey:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FORMA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      - name: The journey, end to end
        working-directory: server
        run: npm run journey:gate
