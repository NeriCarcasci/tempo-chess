# The server: every gate that needs nothing but the repository, and every gate
# that needs a database.
#
# The split is by cost, not by authorship: `offline` needs a checkout,
# `database` needs Postgres. That is the only distinction that changes how long
# you wait or what can go wrong.
#
# What each job runs lives in `server/package.json` as `ci:offline` and
# `ci:database`, not in this file. That is deliberate and it is the second
# consolidation this workflow has had. The first replaced thirteen per-epic
# workflows with one; this one stops the list of gates living in YAML, where the
# only way to run what CI runs was to read a workflow file and retype it. Now
# `npm run ci:offline` is the same thing CI does, so a red build can be
# reproduced in one command instead of guessed at.
#
# Three kinds of check were dropped rather than moved:
#
#   - The `:performance` gates. They assert wall-clock budgets, and a shared
#     runner with noisy neighbours cannot hold one honestly. They were failing
#     for the machine rather than for the code, which is the definition of a
#     gate that teaches people to ignore CI. They still exist and still run
#     locally, where the timings mean something.
#   - `npm audit` at its default threshold, which fails on any advisory at any
#     severity in any transitive dependency. That makes unrelated pull requests
#     red on somebody else's schedule. It runs at `--audit-level=high` now: a
#     real finding still stops the build, an informational one does not.
#
# Two gates stay deliberately out of CI, as they always were:
#   - `security:production-readonly` reads live production and cannot run
#     without credentials. It is a final-evidence gate, run by hand.
#   - `security:rehearsal` builds and destroys its own containers; it belongs to
#     the local evidence lifecycle, and wiring it here would buy a CI runner a
#     container runtime for no new signal.
# Nothing in this file authenticates to anything. No secret is read.

name: Server

on:
  pull_request:
    paths:
      - "server/**"
      - ".node-version"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".node-version"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the forbidden-scope gate reads past commits with
      # `git ls-tree` and `git show`, so a shallow clone makes it vacuous
      # rather than failing it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      # Typecheck, build, unit gates, generated-artifact freshness, and the
      # containment gates. `npm run ci:offline` runs exactly this locally.
      - name: Offline gates
        working-directory: server
        run: npm run ci:offline

      - name: Production dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          cd server && npm audit --omit=dev --audit-level=high

  database:
    name: Database gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          # Trust auth on a throwaway service container reachable only from this
          # job. It also keeps a credential-shaped string out of a tracked file,
          # which the forbidden-scope gate rejects on sight.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Loopback and non-Supabase: the harness refuses anything else, and that
      # guard is deliberately not overridable.
      FORMA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      # The v1 kernel runs first inside `ci:database`. Everything after it
      # mounts routes on the kernel or writes through it, so when the kernel
      # breaks the failures underneath are consequences and the kernel is the
      # one to read.
      - name: Database gates
        working-directory: server
        run: npm run ci:database
