# E17 goal, cycle, requirement, commitment and progress gates.
#
# The offline half carries target resolution, the progress split and plan
# generation, all pure. The database half is where the four promises are
# attempted for real: a cycle that cannot be deleted, a target that must move
# the bar, a commitment that must be confirmed, and a goal that practice cannot
# complete.
#
# Nothing here authenticates to Supabase, Cloud Run, or any production project,
# and no secret is read.

name: E17 goals and coaching cycles

on:
  pull_request:
  push:
    branches: [epic/e17]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      - name: Unit gate
        working-directory: server
        run: |
          npm run goals:unit
          npm run onboarding:unit
          npm run v1:unit

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: The OpenAPI document matches the mounted routes
        working-directory: server
        run: npm run v1:openapi:check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          # Trust auth on a throwaway service container reachable only from this
          # job. It also keeps a credential-shaped string out of a tracked file,
          # which the forbidden-scope gate rejects on sight.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Loopback and non-Supabase: the harness refuses anything else, and that
      # guard is deliberately not overridable.
      FORMA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      - name: Migration gate (empty, prior state, repeat)
        working-directory: server
        run: npm run goals:migration

      - name: E16's gates, which E17 altered a table of
        working-directory: server
        run: |
          npm run onboarding:migration
          npm run onboarding:security

      - name: The v1 kernel gates, which E16 added routes to
        working-directory: server
        run: |
          npm run v1:migration
          npm run v1:integration
          npm run v1:security

      - name: The estimate gates E16 reads from
        working-directory: server
        run: npm run estimates:integration
