# E19 entitlement, usage-ledger and billing-event gates.
#
# The offline half carries entitlement resolution, quota reservation, webhook
# signature verification and out-of-order resolution, all pure. The database
# half is where the auditability constraints are attempted for real: a grant
# that cannot be deleted, usage that cannot be deleted, a retry that cannot
# charge twice, and an API role that can neither grant itself access nor
# fabricate a payment event.
#
# Nothing here authenticates to Stripe, Supabase, Cloud Run, or any production
# project, and no secret is read. There is no live billing configuration in this
# repository at all.

name: E19 entitlements and billing

on:
  pull_request:
  push:
    branches: [epic/e19]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      - name: Unit gate
        working-directory: server
        run: |
          npm run entitlements:unit
          npm run practice:unit
          npm run v1:unit

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: The OpenAPI document matches the mounted routes
        working-directory: server
        run: npm run v1:openapi:check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          # Trust auth on a throwaway service container reachable only from this
          # job. It also keeps a credential-shaped string out of a tracked file,
          # which the forbidden-scope gate rejects on sight.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Loopback and non-Supabase: the harness refuses anything else, and that
      # guard is deliberately not overridable.
      FORMA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      - name: Migration gate (empty, prior state, repeat)
        working-directory: server
        run: npm run entitlements:migration

      - name: The gates E19 sits alongside
        working-directory: server
        run: |
          npm run practice:migration
          npm run onboarding:security

      - name: The v1 kernel gates, which E16 added routes to
        working-directory: server
        run: |
          npm run v1:migration
          npm run v1:integration
          npm run v1:security

      - name: The estimate gates E16 reads from
        working-directory: server
        run: npm run estimates:integration
