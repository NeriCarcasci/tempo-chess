# E20 public projection gates: case studies, the player directory, and the
# approved public statistic.
#
# The offline half carries small-cell suppression, the publication-readiness
# rules and the public projections, all pure. The database half is where the
# privacy claims are attempted for real: a personal subject that cannot be
# published, an approval that cannot be recorded with a box unticked, consent
# whose withdrawal takes a study down on the next request, a hidden profile that
# answers exactly like an unused handle, and an API role that can serve the
# public surface but never publish to it.
#
# Nothing here authenticates to any production project and no secret is read.

name: E20 public projections

on:
  pull_request:
  push:
    branches: [epic/e20]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      - name: Unit gate
        working-directory: server
        run: |
          npm run public:unit
          npm run entitlements:unit
          npm run v1:unit

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: The OpenAPI document matches the mounted routes
        working-directory: server
        run: npm run v1:openapi:check

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          # Trust auth on a throwaway service container reachable only from this
          # job. It also keeps a credential-shaped string out of a tracked file,
          # which the forbidden-scope gate rejects on sight.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Loopback and non-Supabase: the harness refuses anything else, and that
      # guard is deliberately not overridable.
      FORMA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      - name: Migration gate (empty, prior state, repeat)
        working-directory: server
        run: npm run public:migration

      - name: Security gate (forbidden fields, hidden profiles, enumeration, logs)
        working-directory: server
        run: npm run public:security

      - name: Integration gate (publish, read, withdraw, consent)
        working-directory: server
        run: npm run public:integration

      - name: The gates E20 sits alongside
        working-directory: server
        run: |
          npm run entitlements:migration
          npm run onboarding:security

      - name: The v1 kernel gates, which E20 added routes to
        working-directory: server
        run: |
          npm run v1:migration
          npm run v1:integration
          npm run v1:security
