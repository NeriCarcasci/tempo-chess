# The web app: typecheck, tests, build, and the generated API client.
#
# Until recently no CI job ran the frontend at all — a broken screen or a stale
# generated client reached `main` without anything objecting. The one check that
# is easy to miss is the first: `app/lib/v1/schema.d.ts` is generated from
# `server/openapi/v1.json`, which is itself generated from the router, so a
# route change that skips the regeneration leaves the client typed against an
# API that no longer exists. That is why `server/openapi/**` is in the paths
# below: a server change that moves the contract has to re-prove the client.

name: Web

on:
  pull_request:
    paths:
      - "app/**"
      - "public/**"
      - "server/openapi/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "react-router.config.ts"
      - ".node-version"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "server/openapi/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "react-router.config.ts"
      - ".node-version"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: |
          npm ci
          cd server && npm ci

      - name: The generated API client matches the OpenAPI document
        run: |
          npm run api:types
          git diff --exit-code app/lib/v1/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
