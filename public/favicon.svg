<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The mono mark from app/components/Logo.tsx. Solid, one colour: at 16px
       the colour tile's ink outline is half a pixel and the cream crown loses
       its edge, so one shape in one colour is the only thing that survives.

       No tile behind it. A paper square is the brightest object in a dark tab
       strip and the mark ends up reading as a lit block with something in it,
       rather than as the mark. Transparent lets the strip's own colour do the
       work, and the shape gets the room the tile was using.

       The accent is dark enough that it silts up against dark chrome, so the
       dark scheme lifts it. Browsers that ignore prefers-color-scheme in a
       favicon just keep the accent, which is correct on light chrome and the
       common case. -->
  <style>
    path { fill: #cf5730 }
    @media (prefers-color-scheme: dark) { path { fill: #f08a63 } }
  </style>
